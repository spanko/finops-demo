[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gt-finops"
version = "0.1.0"
description = "Grant Thornton FinOps quick-wins analyzer — local recipe engine for Microsoft cost optimization engagements"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Grant Thornton", email = "finops@grantthornton.com" },
]
license = { text = "Proprietary — Grant Thornton internal use" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Information Technology",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "duckdb>=0.10.0",
    "pandas>=2.0.0",
    "pyarrow>=14.0.0",
    "openpyxl>=3.1.0",
    "python-pptx>=0.6.21",
    "jinja2>=3.1.0",
    "plotly>=5.17.0",
    "click>=8.1.0",
    "rich>=13.0.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.6.0",
]
notebook = [
    "jupyterlab>=4.0.0",
    "ipykernel>=6.25.0",
]

[project.scripts]
gt-finops = "gt_finops.cli:main"

[tool.setuptools.packages.find]
include = ["gt_finops*"]

[tool.setuptools.package-data]
gt_finops = ["templates/*.html.j2", "templates/*.pptx", "schema/*.sql"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
